name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Release version, bare semver (example: 0.7.0)"
        required: true
        type: string
      create_release:
        description: "Create the GitHub release after every artifact passes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-source

      - name: Validate release inputs and notes
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          bash scripts/validate_release_dispatch.sh "$VERSION" "$CREATE_RELEASE" "$RELEASE_REF"
          bash scripts/render_release_notes.sh "$VERSION" > "$RUNNER_TEMP/release_body.md"

      - name: Retain reviewed release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-papertiger-${{ inputs.artifact_version }}
          path: ${{ runner.temp }}/release_body.md
          if-no-files-found: error

      - name: Verify exact release source
        shell: bash
        run: bash scripts/cross_check.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-msrv
      - name: Verify minimum supported Rust
        run: cargo +1.95.0 check --locked --workspace --all-targets

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            executable_suffix: .exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve archive names
        id: names
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          bash scripts/validate_release_dispatch.sh \
            "$VERSION" "$CREATE_RELEASE" "$RELEASE_REF"
          bundle="papertiger-${VERSION}-${PLATFORM}"
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"
          echo "archive=${bundle}.${ARCHIVE_EXT}" >> "$GITHUB_OUTPUT"

      # The source job owns the complete workspace suite and strict Clippy.
      # One native runner per non-Linux OS family covers process behavior whose
      # implementation differs by host; every architecture still builds and
      # replays the packaged lifecycle below.
      - name: Test native process boundaries
        if: matrix.platform == 'windows-x86_64' || matrix.platform == 'macos-arm64'
        run: >-
          cargo test --locked -p papertiger-mise --lib --target ${{ matrix.target }}
          executor::tests:: -- --test-threads=1

      - name: Test native process identity
        if: matrix.platform == 'windows-x86_64' || matrix.platform == 'macos-arm64'
        run: >-
          cargo test --locked -p papertiger-mise --lib --target ${{ matrix.target }}
          process_identity::tests:: -- --test-threads=1

      - name: Build release binaries
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}

      - name: Stage release bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          bundle="dist/${{ steps.names.outputs.bundle }}"
          archive="dist/${{ steps.names.outputs.archive }}"
          mkdir -p "${bundle}"
          cp "target/${{ matrix.target }}/release/papertiger" "${bundle}/"
          cp "target/${{ matrix.target }}/release/papertiger-mise" "${bundle}/"
          cp README.md CHANGELOG.md MISE.md agent_integration.md \
             LICENSE LICENSE-SSL LICENSE-VPL "${bundle}/"
          cat > "${bundle}/manifest.json" <<EOF
          {
            "schema": "papertiger.release_manifest.v1",
            "name": "papertiger",
            "version": "${VERSION}",
            "source_commit": "${GITHUB_SHA}",
            "target": "${{ matrix.target }}",
            "platform": "${{ matrix.platform }}",
            "archive": "${{ steps.names.outputs.archive }}",
            "binaries": ["papertiger", "papertiger-mise"],
            "planner_setup_installs_mise": false
          }
          EOF
          chmod +x "${bundle}/papertiger" "${bundle}/papertiger-mise"
          python scripts/package_project.py "$bundle" "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          fi

      - name: Stage release bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/${{ steps.names.outputs.bundle }}"
          archive="dist/${{ steps.names.outputs.archive }}"
          mkdir -p "$bundle"
          cp "target/${{ matrix.target }}/release/papertiger.exe" "$bundle/"
          cp "target/${{ matrix.target }}/release/papertiger-mise.exe" "$bundle/"
          cp README.md CHANGELOG.md MISE.md agent_integration.md \
             LICENSE LICENSE-SSL LICENSE-VPL "$bundle/"
          cat > "$bundle/manifest.json" <<EOF
          {
            "schema": "papertiger.release_manifest.v1",
            "name": "papertiger",
            "version": "${{ inputs.artifact_version }}",
            "source_commit": "${GITHUB_SHA}",
            "target": "${{ matrix.target }}",
            "platform": "${{ matrix.platform }}",
            "archive": "${{ steps.names.outputs.archive }}",
            "binaries": ["papertiger.exe", "papertiger-mise.exe"],
            "planner_setup_installs_mise": false
          }
          EOF
          python scripts/package_project.py "$bundle" "$archive"
          (cd dist && sha256sum "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")

      - name: Verify packaged release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          archive="dist/${{ steps.names.outputs.archive }}"
          verify="dist/verify-${{ matrix.platform }}"
          mkdir -p "$verify"
          tar -xzf "$archive" -C "$verify"
          bundle="$verify/tools/papertiger"
          python scripts/verify_project_bundle.py "$verify"
          python scripts/verify_user_install.py "$bundle/bin/papertiger${{ matrix.executable_suffix }}"
          test "$("$bundle/bin/papertiger" --version)" = "papertiger ${VERSION}"
          test "$("$bundle/bin/papertiger-mise" --version)" = "papertiger-mise ${VERSION}"
          grep -q 'setup-project' < <("$bundle/bin/papertiger" --help)
          grep -q 'uninstall-project' < <("$bundle/bin/papertiger" --help)
          grep -q -- '--project-root' < <("$bundle/bin/papertiger-mise" --help)
          grep -Fq '"schema": "papertiger.release_manifest.v3"' "$bundle/manifest.json"
          grep -Fq '"name": "papertiger"' "$bundle/manifest.json"
          grep -Fq "\"version\": \"${VERSION}\"" "$bundle/manifest.json"
          grep -Fq "\"source_commit\": \"${GITHUB_SHA}\"" "$bundle/manifest.json"
          grep -Fq '"target": "${{ matrix.target }}"' "$bundle/manifest.json"
          grep -Fq '"platform": "${{ matrix.platform }}"' "$bundle/manifest.json"
          grep -Fq '"archive": "${{ steps.names.outputs.archive }}"' "$bundle/manifest.json"
          grep -Fq '"planner_setup_installs_mise": false' "$bundle/manifest.json"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 -c "${{ steps.names.outputs.archive }}.sha256")
          fi

          project="$verify/consumer"
          mkdir -p "$project/nested/work"
          printf 'repository contract\n' > "$project/AGENTS.md"
          printf 'target/\n' > "$project/.gitignore"
          "$bundle/bin/papertiger" setup-project "$project" --json > "$verify/setup.json"
          grep -Fq '"schema": "papertiger.project_install_result.v6"' "$verify/setup.json"
          test -f "$project/tools/papertiger/bin/papertiger"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise"
          test -f "$project/tools/papertiger/project-install.json"
          grep -Fq '"schema": "papertiger.project_install.v2"' \
              "$project/tools/papertiger/project-install.json"
          grep -Fq "\"papertiger_version\": \"${VERSION}\"" \
              "$project/tools/papertiger/project-install.json"
          grep -Fq '"authority_path": "state/papertiger.sqlite"' \
              "$project/tools/papertiger/project-install.json"
          grep -Fq '"agents"' "$project/tools/papertiger/project-install.json"
          test ! -e "$project/scripts/papertiger"
          test ! -e "$project/scripts/papertiger.cmd"
          cmp "$project/tools/papertiger/agent_integration.md" \
              "$bundle/agent_integration.md"
          test -f "$project/.agents/skills/papertiger/SKILL.md"
          test ! -e "$project/.claude/skills/papertiger/SKILL.md"
          cmp "$project/.agents/skills/papertiger/SKILL.md" \
              templates/papertiger/SKILL.md
          test "$(cat "$project/AGENTS.md")" = "repository contract"
          installed_planner="$(cd "$project/tools/papertiger/bin" && pwd)/papertiger"
          test "$(cd "$project" && "$installed_planner" --version)" = "papertiger ${VERSION}"
          (cd "$project/nested/work" && "$installed_planner" init)
          (cd "$project/nested/work" && "$installed_planner" status) > "$verify/planner-status.txt"
          (cd "$project/nested/work" && "$installed_planner" audit)
          test -f "$project/state/papertiger.sqlite"
          test ! -e "$project/nested/work/state"
          "$bundle/bin/papertiger-mise" --project-root "$project" status --json > "$verify/mise-before.json"
          grep -q '"initialized": false' "$verify/mise-before.json"
          "$bundle/bin/papertiger-mise" --project-root "$project" init
          "$bundle/bin/papertiger-mise" --project-root "$project" status --json > "$verify/mise-after.json"
          grep -q '"initialized": true' "$verify/mise-after.json"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise"
          ignore_fingerprint="$(cksum "$project/.gitignore")"
          planner_db_fingerprint="$(cksum "$project/state/papertiger.sqlite")"
          mise_db_fingerprint="$(cksum "$project/state/papertiger-mise.sqlite")"
          "$bundle/bin/papertiger" uninstall-project "$project" --dry-run --json > "$verify/uninstall-dry-run.json"
          grep -Fq '"schema": "papertiger.project_uninstall.v2"' "$verify/uninstall-dry-run.json"
          test -f "$project/tools/papertiger/project-install.json"
          "$bundle/bin/papertiger" uninstall-project "$project" --json > "$verify/uninstall.json"
          test ! -e "$project/tools/papertiger/project-install.json"
          test ! -e "$installed_planner"
          test ! -e "$project/tools/papertiger/agent_integration.md"
          test ! -e "$project/.agents/skills/papertiger/SKILL.md"
          test "$(cat "$project/AGENTS.md")" = "repository contract"
          test "$(cksum "$project/.gitignore")" = "$ignore_fingerprint"
          test "$(cksum "$project/state/papertiger.sqlite")" = "$planner_db_fingerprint"
          test "$(cksum "$project/state/papertiger-mise.sqlite")" = "$mise_db_fingerprint"

      - name: Verify packaged release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          archive="dist/${{ steps.names.outputs.archive }}"
          verify="dist/verify-${{ matrix.platform }}"
          mkdir -p "$verify"
          7z x -y "${archive}" "-o${verify}" >/dev/null
          bundle="$verify/tools/papertiger"
          python scripts/verify_project_bundle.py "$verify"
          python scripts/verify_user_install.py "$bundle/bin/papertiger${{ matrix.executable_suffix }}"
          planner="$bundle/bin/papertiger.exe"
          mise="$bundle/bin/papertiger-mise.exe"
          test "$("$planner" --version)" = "papertiger ${VERSION}"
          test "$("$mise" --version)" = "papertiger-mise ${VERSION}"
          grep -q 'setup-project' < <("$planner" --help)
          grep -q 'uninstall-project' < <("$planner" --help)
          grep -q -- '--project-root' < <("$mise" --help)
          grep -Fq '"schema": "papertiger.release_manifest.v3"' "$bundle/manifest.json"
          grep -Fq '"name": "papertiger"' "$bundle/manifest.json"
          grep -Fq "\"version\": \"${VERSION}\"" "$bundle/manifest.json"
          grep -Fq "\"source_commit\": \"${GITHUB_SHA}\"" "$bundle/manifest.json"
          grep -Fq '"target": "${{ matrix.target }}"' "$bundle/manifest.json"
          grep -Fq '"platform": "${{ matrix.platform }}"' "$bundle/manifest.json"
          grep -Fq '"archive": "${{ steps.names.outputs.archive }}"' "$bundle/manifest.json"
          grep -Fq '"planner_setup_installs_mise": false' "$bundle/manifest.json"
          (cd dist && sha256sum -c "${{ steps.names.outputs.archive }}.sha256")

          project="$verify/consumer"
          mkdir -p "$project/nested/work"
          printf 'repository contract\n' > "$project/AGENTS.md"
          printf 'target/\n' > "$project/.gitignore"
          "$planner" setup-project "$project" --json > "$verify/setup.json"
          grep -Fq '"schema": "papertiger.project_install_result.v6"' "$verify/setup.json"
          test -f "$project/tools/papertiger/bin/papertiger.exe"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise.exe"
          test -f "$project/tools/papertiger/project-install.json"
          grep -Fq '"schema": "papertiger.project_install.v2"' \
              "$project/tools/papertiger/project-install.json"
          grep -Fq "\"papertiger_version\": \"${VERSION}\"" \
              "$project/tools/papertiger/project-install.json"
          grep -Fq '"authority_path": "state/papertiger.sqlite"' \
              "$project/tools/papertiger/project-install.json"
          grep -Fq '"agents"' "$project/tools/papertiger/project-install.json"
          test ! -e "$project/scripts/papertiger"
          test ! -e "$project/scripts/papertiger.cmd"
          cmp "$project/tools/papertiger/agent_integration.md" \
              "$bundle/agent_integration.md"
          test -f "$project/.agents/skills/papertiger/SKILL.md"
          test ! -e "$project/.claude/skills/papertiger/SKILL.md"
          cmp "$project/.agents/skills/papertiger/SKILL.md" \
              templates/papertiger/SKILL.md
          test "$(cat "$project/AGENTS.md")" = "repository contract"
          installed_planner="$(cd "$project/tools/papertiger/bin" && pwd)/papertiger.exe"
          test "$(cd "$project" && "$installed_planner" --version)" = "papertiger ${VERSION}"
          (cd "$project/nested/work" && "$installed_planner" init)
          (cd "$project/nested/work" && "$installed_planner" status) > "$verify/planner-status.txt"
          (cd "$project/nested/work" && "$installed_planner" audit)
          test -f "$project/state/papertiger.sqlite"
          test ! -e "$project/nested/work/state"
          "$mise" --project-root "$project" status --json > "$verify/mise-before.json"
          grep -q '"initialized": false' "$verify/mise-before.json"
          "$mise" --project-root "$project" init
          "$mise" --project-root "$project" status --json > "$verify/mise-after.json"
          grep -q '"initialized": true' "$verify/mise-after.json"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise.exe"

      - name: Verify packaged Windows native lifecycle from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          $project = (Resolve-Path (Join-Path "dist/verify-${{ matrix.platform }}" "consumer")).Path
          $bundle = (Resolve-Path (Join-Path "dist/verify-${{ matrix.platform }}" "tools/papertiger")).Path
          $planner = Join-Path $bundle "bin/papertiger.exe"
          $installedPlanner = Join-Path $project "tools/papertiger/bin/papertiger.exe"
          Push-Location (Join-Path $project "nested/work")
          try {
            $actualVersion = (& $installedPlanner --version).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "project-local native Papertiger invocation failed"
            }
            if ($actualVersion -ne "papertiger $env:VERSION") {
              throw "project-local Papertiger reported '$actualVersion', expected 'papertiger $env:VERSION'"
            }
            & $installedPlanner status | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "nested native Papertiger invocation failed"
            }
          } finally {
            Pop-Location
          }
          $ignoreHash = (Get-FileHash -LiteralPath (Join-Path $project ".gitignore") -Algorithm SHA256).Hash
          $plannerDbHash = (Get-FileHash -LiteralPath (Join-Path $project "state/papertiger.sqlite") -Algorithm SHA256).Hash
          $miseDbHash = (Get-FileHash -LiteralPath (Join-Path $project "state/papertiger-mise.sqlite") -Algorithm SHA256).Hash
          & $planner uninstall-project $project --dry-run --json | Out-Null
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $project "tools/papertiger/project-install.json"))) {
            throw "uninstall dry-run changed the installation or failed"
          }
          & $planner uninstall-project $project --json | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "uninstall-project failed"
          }
          foreach ($removed in @(
            "tools/papertiger/project-install.json",
            "tools/papertiger/bin/papertiger.exe",
            "tools/papertiger/agent_integration.md",
            ".agents/skills/papertiger/SKILL.md"
          )) {
            if (Test-Path -LiteralPath (Join-Path $project $removed)) {
              throw "uninstall retained receipt-owned path $removed"
            }
          }
          if ((Get-Content -LiteralPath (Join-Path $project "AGENTS.md") -Raw).Trim() -ne "repository contract") {
            throw "uninstall changed AGENTS.md"
          }
          if ((Get-FileHash -LiteralPath (Join-Path $project ".gitignore") -Algorithm SHA256).Hash -ne $ignoreHash -or
              (Get-FileHash -LiteralPath (Join-Path $project "state/papertiger.sqlite") -Algorithm SHA256).Hash -ne $plannerDbHash -or
              (Get-FileHash -LiteralPath (Join-Path $project "state/papertiger-mise.sqlite") -Algorithm SHA256).Hash -ne $miseDbHash) {
            throw "uninstall changed retained policy or authority data"
          }

      - name: Verify packaged planner recovery
        shell: bash
        run: |
          set -euo pipefail
          verify="dist/verify-${{ matrix.platform }}"
          planner="$verify/tools/papertiger/bin/papertiger${{ matrix.executable_suffix }}"
          authority="$verify/consumer/state/papertiger.sqlite"
          recovery="$verify/planner-recovery.sqlite"
          authority_before="$(cksum "$authority")"
          "$planner" --db "$authority" export > "$verify/before-recovery.json"
          "$planner" --db "$authority" backup --output "$recovery" --json > "$verify/backup.json"
          grep -Fq '"schema": "papertiger.backup.v1"' "$verify/backup.json"
          grep -Fq '"semantic_validation": "not_performed"' "$verify/backup.json"
          "$planner" --db "$recovery" export > "$verify/after-recovery.json"
          cmp "$verify/before-recovery.json" "$verify/after-recovery.json"
          for suffix in -journal -wal -shm; do
            test ! -e "${recovery}${suffix}"
          done
          if "$planner" --db "$authority" backup --output "${authority}-WAL" > "$verify/refused-backup.txt" 2>&1; then
            echo "backup accepted a reserved SQLite sidecar name" >&2
            exit 1
          fi
          grep -Fq 'SQLite sidecar suffix' "$verify/refused-backup.txt"
          test "$(cksum "$authority")" = "$authority_before"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papertiger-${{ inputs.artifact_version }}-${{ matrix.platform }}
          path: |
            dist/${{ steps.names.outputs.archive }}
            dist/${{ steps.names.outputs.archive }}.sha256
          if-no-files-found: error

  publish-release:
    if: inputs.create_release
    needs: [source, msrv, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: papertiger-${{ inputs.artifact_version }}-*
          merge-multiple: true

      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          bash scripts/render_release_notes.sh "$VERSION" > release_body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.artifact_version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Papertiger ${VERSION}" \
            --notes-file release_body.md \
            release-assets/*
