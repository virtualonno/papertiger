name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Release version, bare semver (example: 0.7.0)"
        required: true
        type: string
      create_release:
        description: "Create the GitHub release after every artifact passes"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Verify exact release source
        shell: bash
        run: bash scripts/cross_check.sh

  build:
    needs: source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            executable_suffix: .exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: ${{ matrix.target }}

      - name: Resolve archive names
        id: names
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          bash scripts/validate_release_dispatch.sh \
            "$VERSION" "$CREATE_RELEASE" "$RELEASE_REF"
          bundle="papertiger-${VERSION}-${PLATFORM}"
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"
          echo "archive=${bundle}.${ARCHIVE_EXT}" >> "$GITHUB_OUTPUT"

      # The source job owns the complete workspace suite. These focused tests
      # cover code whose behavior or implementation differs by host OS.
      - name: Test native process boundaries
        run: >-
          cargo test --locked -p papertiger-mise --lib --target ${{ matrix.target }}
          executor::tests:: -- --test-threads=1

      - name: Test native path and evidence boundaries
        run: >-
          cargo test --locked -p papertiger-mise --lib --target ${{ matrix.target }}
          object::tests:: -- --test-threads=1

      - name: Test native process identity
        run: >-
          cargo test --locked -p papertiger-mise --lib --target ${{ matrix.target }}
          process_identity::tests:: -- --test-threads=1

      - name: Test project-root integration
        run: >-
          cargo test --locked -p papertiger-mise --test project_root_cli
          --target ${{ matrix.target }} -- --test-threads=1

      - name: Test project setup integration
        run: >-
          cargo test --locked -p papertiger --bin papertiger --target ${{ matrix.target }}
          project_setup::tests:: -- --test-threads=1

      - name: Lint native target
        run: >-
          cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }}
          -- -D warnings

      - name: Build release binaries
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}

      - name: Stage release bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          bundle="dist/${{ steps.names.outputs.bundle }}"
          archive="dist/${{ steps.names.outputs.archive }}"
          mkdir -p "${bundle}"
          cp "target/${{ matrix.target }}/release/papertiger" "${bundle}/"
          cp "target/${{ matrix.target }}/release/papertiger-mise" "${bundle}/"
          cp README.md CHANGELOG.md MISE.md agent_integration.md \
             LICENSE LICENSE-SSL LICENSE-VPL "${bundle}/"
          cat > "${bundle}/manifest.json" <<EOF
          {
            "schema": "papertiger.release-manifest.v1",
            "name": "papertiger",
            "version": "${VERSION}",
            "source_commit": "${GITHUB_SHA}",
            "target": "${{ matrix.target }}",
            "platform": "${{ matrix.platform }}",
            "archive": "${{ steps.names.outputs.archive }}",
            "binaries": ["papertiger", "papertiger-mise"],
            "planner_setup_installs_mise": false
          }
          EOF
          chmod +x "${bundle}/papertiger" "${bundle}/papertiger-mise"
          tar -czf "${archive}" -C dist "${{ steps.names.outputs.bundle }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          fi

      - name: Stage release bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/${{ steps.names.outputs.bundle }}"
          archive="dist/${{ steps.names.outputs.archive }}"
          mkdir -p "$bundle"
          cp "target/${{ matrix.target }}/release/papertiger.exe" "$bundle/"
          cp "target/${{ matrix.target }}/release/papertiger-mise.exe" "$bundle/"
          cp README.md CHANGELOG.md MISE.md agent_integration.md \
             LICENSE LICENSE-SSL LICENSE-VPL "$bundle/"
          cat > "$bundle/manifest.json" <<EOF
          {
            "schema": "papertiger.release-manifest.v1",
            "name": "papertiger",
            "version": "${{ inputs.artifact_version }}",
            "source_commit": "${GITHUB_SHA}",
            "target": "${{ matrix.target }}",
            "platform": "${{ matrix.platform }}",
            "archive": "${{ steps.names.outputs.archive }}",
            "binaries": ["papertiger.exe", "papertiger-mise.exe"],
            "planner_setup_installs_mise": false
          }
          EOF
          (cd dist && 7z a -tzip "${{ steps.names.outputs.archive }}" "${{ steps.names.outputs.bundle }}" >/dev/null)
          (cd dist && sha256sum "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")

      - name: Verify packaged release (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          archive="dist/${{ steps.names.outputs.archive }}"
          verify="dist/verify-${{ matrix.platform }}"
          mkdir -p "$verify"
          tar -xzf "$archive" -C "$verify"
          bundle="$verify/${{ steps.names.outputs.bundle }}"
          test "$("$bundle/papertiger" --version)" = "papertiger ${VERSION}"
          test "$("$bundle/papertiger-mise" --version)" = "papertiger-mise ${VERSION}"
          grep -q 'setup-project' < <("$bundle/papertiger" --help)
          grep -q -- '--project-root' < <("$bundle/papertiger-mise" --help)
          grep -Fq '"schema": "papertiger.release-manifest.v1"' "$bundle/manifest.json"
          grep -Fq '"name": "papertiger"' "$bundle/manifest.json"
          grep -Fq "\"version\": \"${VERSION}\"" "$bundle/manifest.json"
          grep -Fq "\"source_commit\": \"${GITHUB_SHA}\"" "$bundle/manifest.json"
          grep -Fq '"target": "${{ matrix.target }}"' "$bundle/manifest.json"
          grep -Fq '"platform": "${{ matrix.platform }}"' "$bundle/manifest.json"
          grep -Fq '"archive": "${{ steps.names.outputs.archive }}"' "$bundle/manifest.json"
          grep -Fq '"binaries": ["papertiger", "papertiger-mise"]' "$bundle/manifest.json"
          grep -Fq '"planner_setup_installs_mise": false' "$bundle/manifest.json"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 -c "${{ steps.names.outputs.archive }}.sha256")
          fi

          project="$verify/consumer"
          mkdir -p "$project/nested/work"
          printf 'repository contract\n' > "$project/AGENTS.md"
          printf 'target/\n' > "$project/.gitignore"
          "$bundle/papertiger" setup-project "$project" --json > "$verify/setup.json"
          grep -Fq '"schema": "papertiger.project_setup.v2"' "$verify/setup.json"
          test -f "$project/tools/papertiger/bin/papertiger"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise"
          test -f "$project/tools/papertiger/project-install.json"
          grep -Fq '"schema": "papertiger.project_install.v1"' \
              "$project/tools/papertiger/project-install.json"
          grep -Fq "\"papertiger_version\": \"${VERSION}\"" \
              "$project/tools/papertiger/project-install.json"
          grep -Fq '"authority_path": "state/papertiger.sqlite"' \
              "$project/tools/papertiger/project-install.json"
          test -f "$project/scripts/papertiger.cmd"
          cmp "$project/tools/papertiger/agent_integration.md" \
              "$bundle/agent_integration.md"
          test -f "$project/.agents/skills/papertiger/SKILL.md"
          test -f "$project/.claude/skills/papertiger/SKILL.md"
          cmp "$project/.agents/skills/papertiger/SKILL.md" \
              "$project/.claude/skills/papertiger/SKILL.md"
          cmp "$project/.agents/skills/papertiger/SKILL.md" \
              templates/papertiger/SKILL.md
          test "$(cat "$project/AGENTS.md")" = "repository contract"
          test "$(cd "$project" && ./scripts/papertiger --version)" = "papertiger ${VERSION}"
          (cd "$project/nested/work" && ../../scripts/papertiger init)
          (cd "$project/nested/work" && ../../scripts/papertiger status) > "$verify/planner-status.txt"
          (cd "$project/nested/work" && ../../scripts/papertiger audit)
          test -f "$project/state/papertiger.sqlite"
          test ! -e "$project/nested/work/state"
          "$bundle/papertiger-mise" --project-root "$project" status --json > "$verify/mise-before.json"
          grep -q '"initialized": false' "$verify/mise-before.json"
          "$bundle/papertiger-mise" --project-root "$project" init
          "$bundle/papertiger-mise" --project-root "$project" status --json > "$verify/mise-after.json"
          grep -q '"initialized": true' "$verify/mise-after.json"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise"

      - name: Verify packaged release (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          archive="dist/${{ steps.names.outputs.archive }}"
          verify="dist/verify-${{ matrix.platform }}"
          mkdir -p "$verify"
          7z x -y "${archive}" "-o${verify}" >/dev/null
          bundle="$verify/${{ steps.names.outputs.bundle }}"
          planner="$bundle/papertiger.exe"
          mise="$bundle/papertiger-mise.exe"
          test "$("$planner" --version)" = "papertiger ${VERSION}"
          test "$("$mise" --version)" = "papertiger-mise ${VERSION}"
          grep -q 'setup-project' < <("$planner" --help)
          grep -q -- '--project-root' < <("$mise" --help)
          grep -Fq '"schema": "papertiger.release-manifest.v1"' "$bundle/manifest.json"
          grep -Fq '"name": "papertiger"' "$bundle/manifest.json"
          grep -Fq "\"version\": \"${VERSION}\"" "$bundle/manifest.json"
          grep -Fq "\"source_commit\": \"${GITHUB_SHA}\"" "$bundle/manifest.json"
          grep -Fq '"target": "${{ matrix.target }}"' "$bundle/manifest.json"
          grep -Fq '"platform": "${{ matrix.platform }}"' "$bundle/manifest.json"
          grep -Fq '"archive": "${{ steps.names.outputs.archive }}"' "$bundle/manifest.json"
          grep -Fq '"binaries": ["papertiger.exe", "papertiger-mise.exe"]' "$bundle/manifest.json"
          grep -Fq '"planner_setup_installs_mise": false' "$bundle/manifest.json"
          (cd dist && sha256sum -c "${{ steps.names.outputs.archive }}.sha256")

          project="$verify/consumer"
          mkdir -p "$project/nested/work"
          printf 'repository contract\n' > "$project/AGENTS.md"
          printf 'target/\n' > "$project/.gitignore"
          "$planner" setup-project "$project" --json > "$verify/setup.json"
          grep -Fq '"schema": "papertiger.project_setup.v2"' "$verify/setup.json"
          test -f "$project/tools/papertiger/bin/papertiger.exe"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise.exe"
          test -f "$project/tools/papertiger/project-install.json"
          grep -Fq '"schema": "papertiger.project_install.v1"' \
              "$project/tools/papertiger/project-install.json"
          grep -Fq "\"papertiger_version\": \"${VERSION}\"" \
              "$project/tools/papertiger/project-install.json"
          grep -Fq '"authority_path": "state/papertiger.sqlite"' \
              "$project/tools/papertiger/project-install.json"
          test -f "$project/scripts/papertiger.cmd"
          cmp "$project/tools/papertiger/agent_integration.md" \
              "$bundle/agent_integration.md"
          test -f "$project/.agents/skills/papertiger/SKILL.md"
          test -f "$project/.claude/skills/papertiger/SKILL.md"
          cmp "$project/.agents/skills/papertiger/SKILL.md" \
              "$project/.claude/skills/papertiger/SKILL.md"
          cmp "$project/.agents/skills/papertiger/SKILL.md" \
              templates/papertiger/SKILL.md
          test "$(cat "$project/AGENTS.md")" = "repository contract"
          test "$(cd "$project" && ./scripts/papertiger --version)" = "papertiger ${VERSION}"
          (cd "$project/nested/work" && ../../scripts/papertiger init)
          (cd "$project/nested/work" && ../../scripts/papertiger status) > "$verify/planner-status.txt"
          (cd "$project/nested/work" && ../../scripts/papertiger audit)
          test -f "$project/state/papertiger.sqlite"
          test ! -e "$project/nested/work/state"
          "$mise" --project-root "$project" status --json > "$verify/mise-before.json"
          grep -q '"initialized": false' "$verify/mise-before.json"
          "$mise" --project-root "$project" init
          "$mise" --project-root "$project" status --json > "$verify/mise-after.json"
          grep -q '"initialized": true' "$verify/mise-after.json"
          test ! -e "$project/tools/papertiger/bin/papertiger-mise.exe"

      - name: Verify packaged Windows launcher from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          $project = Join-Path "dist/verify-${{ matrix.platform }}" "consumer"
          Push-Location $project
          try {
            $actualVersion = (& .\scripts\papertiger.cmd --version).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "project-root papertiger.cmd invocation failed"
            }
            if ($actualVersion -ne "papertiger $env:VERSION") {
              throw "papertiger.cmd reported '$actualVersion', expected 'papertiger $env:VERSION'"
            }
          } finally {
            Pop-Location
          }
          Push-Location (Join-Path $project "nested/work")
          try {
            & ..\..\scripts\papertiger.cmd status | Out-Null
            if ($LASTEXITCODE -ne 0) {
              throw "nested papertiger.cmd invocation failed"
            }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: papertiger-${{ inputs.artifact_version }}-${{ matrix.platform }}
          path: |
            dist/${{ steps.names.outputs.archive }}
            dist/${{ steps.names.outputs.archive }}.sha256
          if-no-files-found: error

  publish-release:
    if: inputs.create_release
    needs: [source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: release-assets
          pattern: papertiger-${{ inputs.artifact_version }}-*
          merge-multiple: true

      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          bash scripts/render_release_notes.sh "$VERSION" > release_body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.artifact_version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Papertiger ${VERSION}" \
            --notes-file release_body.md \
            release-assets/*
