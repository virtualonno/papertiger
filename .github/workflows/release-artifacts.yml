name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_version:
        description: "Release version, bare semver (example: 0.7.0)"
        required: true
        type: string
      create_release:
        description: "Create the GitHub release after every artifact passes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-source

      - name: Validate release inputs and notes
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          bash scripts/validate_release_dispatch.sh "$VERSION" "$CREATE_RELEASE" "$RELEASE_REF"
          bash scripts/render_release_notes.sh "$VERSION" > "$RUNNER_TEMP/release_body.md"

      - name: Retain reviewed release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-papertiger-${{ inputs.artifact_version }}
          path: ${{ runner.temp }}/release_body.md
          if-no-files-found: error

      - name: Verify exact release source
        shell: bash
        run: bash scripts/cross_check.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-msrv
      - name: Verify minimum supported Rust
        run: cargo +1.95.0 check --locked --workspace --all-targets

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos-arm64
            executable_suffix: ""
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            executable_suffix: .exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve archive names
        id: names
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          bash scripts/validate_release_dispatch.sh \
            "$VERSION" "$CREATE_RELEASE" "$RELEASE_REF"
          bundle="papertiger-${VERSION}-${PLATFORM}"
          echo "bundle=${bundle}" >> "$GITHUB_OUTPUT"
          echo "archive=${bundle}.${ARCHIVE_EXT}" >> "$GITHUB_OUTPUT"

      # The source job owns the complete workspace suite and strict Clippy.
      # One native runner per non-Linux OS family covers process behavior whose
      # implementation differs by host; every architecture still builds and
      # replays the packaged lifecycle below.
      - name: Test native process boundaries
        if: matrix.platform == 'windows-x86_64' || matrix.platform == 'macos-arm64'
        run: >-
          cargo test --locked -p papertiger-mise --lib --target ${{ matrix.target }}
          executor::tests:: -- --test-threads=1

      - name: Test native process identity
        if: matrix.platform == 'windows-x86_64' || matrix.platform == 'macos-arm64'
        run: >-
          cargo test --locked -p papertiger-mise --lib --target ${{ matrix.target }}
          process_identity::tests:: -- --test-threads=1

      - name: Build release binaries
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}

      - name: Package the skill directory
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/${{ steps.names.outputs.archive }}"
          mkdir -p dist
          python scripts/package_skill.py "target/${{ matrix.target }}/release" "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256")
          fi

      - name: Verify the packaged skill directory
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          archive="dist/${{ steps.names.outputs.archive }}"
          verify="dist/verify-${{ matrix.platform }}"
          mkdir -p "$verify"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum -c "${{ steps.names.outputs.archive }}.sha256")
          else
            (cd dist && shasum -a 256 -c "${{ steps.names.outputs.archive }}.sha256")
          fi
          case "$archive" in
            *.zip) 7z x -y "$archive" "-o$verify" >/dev/null ;;
            *) tar -xzf "$archive" -C "$verify" ;;
          esac
          test "$(ls "$verify")" = "papertiger"
          python scripts/verify_skill.py "$verify/papertiger" "$VERSION"

      - name: Verify the skill binary from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ inputs.artifact_version }}
          PAPERTIGER_MODEL: human
        run: |
          $planner = (Resolve-Path "dist/verify-${{ matrix.platform }}/papertiger/bin/papertiger.exe").Path
          $project = Join-Path $env:RUNNER_TEMP "papertiger-pwsh-project"
          New-Item -ItemType Directory -Force (Join-Path $project "nested/work") | Out-Null
          & $planner --project-root $project init | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "init through --project-root failed" }
          Push-Location (Join-Path $project "nested/work")
          try {
            $actualVersion = (& $planner --version).Trim()
            if ($actualVersion -ne "papertiger $env:VERSION") {
              throw "skill binary reported '$actualVersion', expected 'papertiger $env:VERSION'"
            }
            & $planner status | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "nested native Papertiger invocation failed" }
          } finally {
            Pop-Location
          }

      - name: Verify packaged planner recovery
        shell: bash
        run: |
          set -euo pipefail
          verify="dist/verify-${{ matrix.platform }}"
          planner="$verify/papertiger/bin/papertiger${{ matrix.executable_suffix }}"
          authority="$verify/recovery-source.sqlite"
          "$planner" --db "$authority" init
          PAPERTIGER_MODEL=human "$planner" --db "$authority" plan add work "Recovery work"
          recovery="$verify/planner-recovery.sqlite"
          authority_before="$(cksum "$authority")"
          "$planner" --db "$authority" export > "$verify/before-recovery.json"
          "$planner" --db "$authority" backup --output "$recovery" --json > "$verify/backup.json"
          grep -Fq '"schema": "papertiger.backup.v1"' "$verify/backup.json"
          grep -Fq '"semantic_validation": "not_performed"' "$verify/backup.json"
          "$planner" --db "$recovery" export > "$verify/after-recovery.json"
          cmp "$verify/before-recovery.json" "$verify/after-recovery.json"
          for suffix in -journal -wal -shm; do
            test ! -e "${recovery}${suffix}"
          done
          if "$planner" --db "$authority" backup --output "${authority}-WAL" > "$verify/refused-backup.txt" 2>&1; then
            echo "backup accepted a reserved SQLite sidecar name" >&2
            exit 1
          fi
          grep -Fq 'SQLite sidecar suffix' "$verify/refused-backup.txt"
          test "$(cksum "$authority")" = "$authority_before"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: papertiger-${{ inputs.artifact_version }}-${{ matrix.platform }}
          path: |
            dist/${{ steps.names.outputs.archive }}
            dist/${{ steps.names.outputs.archive }}.sha256
          if-no-files-found: error

  publish-release:
    if: inputs.create_release
    needs: [source, msrv, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          pattern: papertiger-${{ inputs.artifact_version }}-*
          merge-multiple: true

      - name: Extract release notes
        shell: bash
        env:
          VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          bash scripts/render_release_notes.sh "$VERSION" > release_body.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.artifact_version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "Papertiger ${VERSION}" \
            --notes-file release_body.md \
            release-assets/*
